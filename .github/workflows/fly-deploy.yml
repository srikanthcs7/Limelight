name: Deploy backend to Fly

# Deploys the FastAPI backend to Fly on every push that touches backend/.
# Runs on GitHub's runners (which have network access to Fly), so no local
# flyctl or egress is needed.
#
# One-time setup:
#   1. `fly apps create limelight-api`  (or create it in the Fly dashboard)
#   2. Add repo secret FLY_API_TOKEN  (GitHub → Settings → Secrets → Actions).
#      Generate with: `fly tokens create deploy -a limelight-api`
#   3. Set app secrets in the Fly dashboard (OPENAI_API_KEY, DATABASE_URL,
#      DATABASE_URL_DIRECT) — see docs/DEPLOY.md.

on:
  push:
    branches: [main, claude/eager-mccarthy-f499oq]
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
